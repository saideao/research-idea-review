# idea-review configuration
#
# 1. Register the models you want to use under [providers.xxx]. API keys do not go in this file;
#    only the name of the environment variable does. Export it in your terminal before running,
#    e.g.: export ANTHROPIC_API_KEY=sk-...
# 2. Under [roles], choose which model handles each step.
#    The proposal writer (writer) and the meta reviewers (reviewers) should ideally come from different
#    companies: models tend to please the user and rate their own writing too kindly.
# 3. Model names change. The names below are examples only; use the ones available in each vendor's console.
#    Set family to the company name, the same for all models from one company. The program uses it to check
#    whether the writer and the reviewers come from the same company.

[providers.claude]
type = "anthropic"                 # uses the official Anthropic SDK
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
family = "anthropic"
effort = "medium"                  # thinking effort: low / medium / high / xhigh / max
fallbacks = "default"              # if a safety classifier refuses, the server retries on a fallback model; set "off" to disable
concurrency = 4

[providers.gpt]
type = "openai_compatible"
base_url = "https://api.openai.com/v1"
model = "gpt-5.4"
api_key_env = "OPENAI_API_KEY"
family = "openai"
max_tokens_param = "max_completion_tokens"   # OpenAI reasoning models use this parameter name
max_tokens = 32000

[providers.gemini]
type = "openai_compatible"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-3.1-pro"
api_key_env = "GEMINI_API_KEY"
family = "google"
max_tokens = 32000

[providers.deepseek]
type = "openai_compatible"
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
family = "deepseek"
max_tokens = 8000

# Any other service with an OpenAI-compatible API works the same way: fill in base_url and model.
# A local proxy such as LiteLLM also works, e.g. base_url = "http://127.0.0.1:4000/v1".

# [providers.other]
# type = "openai_compatible"
# base_url = "https://api.example.com/v1"
# model = "the model name from the vendor's console"
# api_key_env = "OTHER_API_KEY"
# family = "other-company"

[roles]
planner = "claude"                 # plan search queries
screener = "claude"                # screen by title and abstract (only decides which full texts to read first)
reader = "claude"                  # read full texts, judge paper quality, check abstract against body
miner = "claude"                   # map the landscape, find gaps
writer = "claude"                  # mine new directions, write proposals (Model A)
reviewers = ["gpt", "gemini", "deepseek"]   # meta reviews (Models B, C, D), each in a fresh conversation
chair = "gpt"                      # summarize where the reviewers agree and disagree, no verdict

[search]
sources = ["semantic_scholar", "arxiv", "openalex"]
per_query = 20                     # papers per query, per source (1–100); only used for the first search
max_candidates = 80                # candidates: how many to keep after deduplication for screening (5–300). Override with --candidates N
download = 15                      # papers read in full: how many full texts to download and read (1–50, at most the number of candidates).
                                   # A failed download is replaced by the next paper until the number is reached or the
                                   # high- and medium-relevance candidates run out. Override with --refs N
# year_from = 2020                 # only papers from this year on
# openalex_mailto = "you@example.com"   # optional; OpenAlex is more lenient with rate limits if you leave an email
s2_api_key_env = "S2_API_KEY"      # optional; a Semantic Scholar key makes searching faster

[review]
ideas = 4                          # total proposals: 1 for your original idea + 3 new directions
lang = "en"                        # version of the prompts and report: en English / zh Chinese
language = "English"               # language the models write in; defaults to match lang
max_fulltext_chars = 60000         # max characters of each full text given to the reader; longer texts keep the start and end
reviewer_fulltext_papers = 3       # reviewers also get excerpts of the closest few papers
reviewer_fulltext_chars = 15000    # characters per excerpt
screen_batch = 20                  # papers shown to the model per screening request
