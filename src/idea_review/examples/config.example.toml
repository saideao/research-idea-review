# type = "codebuddy"               # 调用 codebuddy 命令（腾讯 CodeBuddy），用它登录的腾讯账号
# model = "hy3"                    # 可选，默认混元 hy3。也能填它支持的别家模型，family 按模型名定

[roles]
planner = "claude"                 # 拆检索词
screener = "claude"                # 按标题和摘要初筛（只决定先读哪些全文）
reader = "claude"                  # 精读全文、判断文献质量、核对摘要和正文
miner = "claude"                   # 画版图、找空白
writer = "claude"                  # 挖新方向、写 proposal（模型 A）
reviewers = ["gpt", "gemini", "deepseek"]   # 元评审（模型 B、C、D），各开一个新对话
chair = "gpt"                      # 汇总几位评审的共识和分歧，不下结论

[search]
sources = ["semantic_scholar", "arxiv", "openalex"]
per_query = 20                     # 每条检索式、每个来源取多少篇（1–100），只在第一次检索时用
max_candidates = 80                # 候选篇数：合并去重后留多少篇去初筛（5–300）。运行时可以用 --candidates N 覆盖
download = 15                      # 精读篇数：下载全文并逐篇精读多少篇（1–50，不能多于候选篇数）。
                                   # 下载失败的往下顺延；候选里能下载的用完了还不够，自动从检索结果里多取候选，
                                   # 最多扩到候选篇数的 3 倍。运行时可以用 --refs N 覆盖
# year_from = 2020                 # 只看这一年以后的论文
# openalex_mailto = "you@example.com"   # 可选，OpenAlex 建议留个邮箱，限流更宽松
s2_api_key_env = "S2_API_KEY"      # 可选，有 Semantic Scholar 的 key 会快一些

[review]
ideas = 4                          # proposal 总数：你的原始 idea 1 份 + 新方向 3 份
lang = "zh"                        # 提示词和报告用哪个版本：zh 中文 / en 英文
language = "中文"                  # 模型用什么语言写，不填就跟 lang 一致
min_fulltexts = 3                  # 读到的全文少于这个数，或者全是低质量，就停在第 5 步，不往下找空白、写 proposal。
                                   # 想照样跑完，运行时加 --force
max_fulltext_chars = 60000         # 精读时每篇全文最多给多少字符，超出的保留开头和结尾
reviewer_fulltext_papers = 3       # 评审时附上最接近的几篇论文的全文节选
reviewer_fulltext_chars = 15000    # 每篇节选多少字符
screen_batch = 20                  # 初筛时每次给模型看多少篇
