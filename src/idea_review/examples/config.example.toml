# idea-review 配置
#
# 1. 在 [providers.xxx] 里登记你要用的模型。API Key 不写在这里，只写环境变量的名字，
#    运行前在终端里 export，比如：export ANTHROPIC_API_KEY=sk-...
# 2. 在 [roles] 里指定每个环节用哪个模型。
#    写 proposal 的（writer）和做元评审的（reviewers）最好来自不同公司：
#    模型都有点讨好用户，给自己写的东西打分也偏高。
# 3. 模型名会更新，下面的写法只是示例，以各家控制台里你能用的为准。
#    family 填公司名，同一家公司的模型填同一个，程序用它检查"写的和审的是不是一家"。

[providers.claude]
type = "anthropic"                 # 走 Anthropic 官方 SDK
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
family = "anthropic"
effort = "medium"                  # 思考深度：low / medium / high / xhigh / max
fallbacks = "default"              # 被安全分类器拒答时由服务端自动换模型重跑；不要就写 "off"
concurrency = 4

[providers.gpt]
type = "openai_compatible"
base_url = "https://api.openai.com/v1"
model = "gpt-5.4"
api_key_env = "OPENAI_API_KEY"
family = "openai"
max_tokens_param = "max_completion_tokens"   # OpenAI 的推理模型用这个参数名
max_tokens = 32000

[providers.gemini]
type = "openai_compatible"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-3.1-pro"
api_key_env = "GEMINI_API_KEY"
family = "google"
max_tokens = 32000

[providers.deepseek]
type = "openai_compatible"
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
family = "deepseek"
max_tokens = 8000

