# Trial configuration: search and downloads are real, but every model is a mock, so no paid API is called.
# Use it to check that the pipeline runs and to see what the report looks like. All text in the report is placeholder text.
# Mock models cannot plan real search queries, so give English queries yourself with --query (repeatable):
#   idea-review run "your idea" --config config.mock.toml --query "first query" --query "second query"

[providers.writer_mock]
type = "mock"
model = "mock-a"
family = "vendor-a"

[providers.reviewer_b]
type = "mock"
model = "mock-b"
family = "vendor-b"

[providers.reviewer_c]
type = "mock"
model = "mock-c"
family = "vendor-c"

[roles]
planner = "writer_mock"
screener = "writer_mock"
reader = "writer_mock"
miner = "writer_mock"
writer = "writer_mock"
reviewers = ["reviewer_b", "reviewer_c"]
chair = "reviewer_b"

[search]
sources = ["semantic_scholar", "arxiv", "openalex"]
per_query = 10
max_candidates = 40
download = 5

[review]
ideas = 3
lang = "en"
